[package]
name = "lumapy"
version = "0.1.2"
edition = "2024"
description = "Python bindings for Luma: lazy GPU arrays on wgpu (Vulkan, Metal, DX12)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/flipnoteman/LumaPy"
rust-version = "1.99"
publish = false

[lib]
name = "_lumapy"
crate-type = ["cdylib"]

[dependencies]
# Pinned to a Luma commit: the bindings use API newer than the latest release (0.4.1). Switch to
# a crates.io version once Luma publishes one. To build against a local checkout instead, see
# "Developing against a local Luma" in the README.
luma = { git = "https://github.com/flipnoteman/Luma", rev = "5a592c4c53137ff93e4d0437818d47a24c1f3fbc" }
pyo3 = { version = "0.30", features = ["abi3-py310", "multiple-pymethods"] }
numpy = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
