[package]
name = "lumapy"
version = "0.1.2"
edition = "2024"
description = "Python bindings for Luma: lazy GPU arrays on wgpu (Vulkan, Metal, DX12)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/flipnoteman/LumaPy"
rust-version = "1.99"
publish = false

[lib]
name = "_lumapy"
crate-type = ["cdylib"]

[dependencies]
# To build against a local Luma checkout instead, see "Developing against a local Luma" in CONTRIBUTING.md.
luma = "0.5.1"
pyo3 = { version = "0.30", features = ["abi3-py310", "multiple-pymethods"] }
numpy = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
