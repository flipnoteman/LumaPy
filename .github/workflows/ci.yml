name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GitHub's Linux runners have no GPU: Luma runs on Mesa's software Vulkan driver.
  LUMA_DEVICE: cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python -m pip install --upgrade pip && pip install --group lint
      - run: ruff check python tests examples
      - run: ruff format --check python tests examples
      - run: mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          # Apple Silicon runners have a (virtualized) Metal GPU.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install software Vulkan (Mesa lavapipe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Use the GPU on macOS
        if: runner.os == 'macOS'
        run: echo "LUMA_DEVICE=auto" >> "$GITHUB_ENV"
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install --group test
          pip install -v .
      - run: pytest
      - name: Check the type stubs against the extension
        if: matrix.python == '3.13' && runner.os == 'Linux'
        run: |
          pip install --group lint
          python -m mypy.stubtest lumapy._lumapy
